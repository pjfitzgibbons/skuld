<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Skuld{% endblock %}</title>
  <style>
    :root { color-scheme: light dark; --fg: #1f2328; --bg: #ffffff; --muted: #59636e; --rule: #d1d9e0; --link: #0969da; }
    @media (prefers-color-scheme: dark) {
      :root { --fg: #e6edf3; --bg: #0d1117; --muted: #9198a1; --rule: #3d444d; --link: #4493f8; }
    }
    body { margin: 0; padding: 24px 16px; font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; color: var(--fg); background: var(--bg); }
    main { max-width: 860px; margin: 0 auto; }
    header { border-bottom: 1px solid var(--rule); margin-bottom: 16px; }
    h1 { font-size: 20px; margin: 0 0 8px; }
    a { color: var(--link); }
    table { border-collapse: collapse; width: 100%; }
    th, td { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--rule); vertical-align: top; }
    th { color: var(--muted); font-weight: 600; }
    .key { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; white-space: nowrap; }
    .muted { color: var(--muted); }
    header nav { display: flex; flex-wrap: wrap; gap: 4px 16px; margin: 0 0 12px; }
    .notes { border-left: 3px solid var(--rule); padding: 4px 12px; margin: 0 0 16px; }
    .report { white-space: pre-wrap; overflow-wrap: anywhere; font: 14px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace; }
    .scroll { overflow-x: auto; }
  </style>
</head>
<body>
<main>
  <header>
    <h1>{% block heading %}Skuld{% endblock %}</h1>
    {% block header_links %}{% endblock %}
  </header>
  {% block content %}{% endblock %}
</main>
</body>
</html>
