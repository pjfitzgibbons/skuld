<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Skuld{% endblock %}</title>
  <style>
    :root { color-scheme: light dark; --fg: #1f2328; --bg: #ffffff; --muted: #59636e; --rule: #d1d9e0; --link: #0969da; }
    @media (prefers-color-scheme: dark) {
      :root { --fg: #e6edf3; --bg: #0d1117; --muted: #9198a1; --rule: #3d444d; --link: #4493f8; }
    }
    body { margin: 0; padding: 24px 16px; font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; color: var(--fg); background: var(--bg); }
    main { max-width: 860px; margin: 0 auto; }
    header { border-bottom: 1px solid var(--rule); margin-bottom: 16px; }
    h1 { font-size: 20px; margin: 0 0 8px; }
    a { color: var(--link); }
    table { border-collapse: collapse; width: 100%; }
    th, td { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--rule); vertical-align: top; }
    th { color: var(--muted); font-weight: 600; }
    .key { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; white-space: nowrap; }
    .muted { color: var(--muted); }
    .issue { display: grid; grid-template-columns: minmax(0, 1fr) 240px; gap: 24px; }
    @media (max-width: 640px) { .issue { grid-template-columns: minmax(0, 1fr); } }
    h2 { font-size: 16px; margin: 20px 0 6px; }
    section:first-child h2 { margin-top: 0; }
    h3 { font-size: 15px; margin: 14px 0 4px; }
    article p, article li { overflow-wrap: anywhere; }
    article p { margin: 0 0 10px; }
    article ul { margin: 0 0 10px; padding-left: 20px; }
    li.task { list-style: none; margin-left: -20px; padding-left: 22px; text-indent: -22px; }
    .log { list-style: none; padding: 0; margin: 0; }
    .log li { padding: 4px 0; border-bottom: 1px solid var(--rule); overflow-wrap: anywhere; }
    .log time { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; margin-right: 6px; }
    .fields th { width: 40%; }
    .path { font-size: 13px; overflow-wrap: anywhere; }
  </style>
</head>
<body>
<main>
  <header><h1>{% block heading %}Skuld{% endblock %}</h1></header>
  {% block content %}{% endblock %}
</main>
</body>
</html>
